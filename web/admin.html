<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - BSFChat ID</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">BSFChat ID</div>
        <div class="nav-links">
            <a href="/profile.html">Profile</a>
            <a href="/admin.html" class="active">Admin</a>
            <a href="#" id="logout-btn">Sign Out</a>
        </div>
    </nav>

    <div class="container">
        <div class="card wide">
            <h2>User Management</h2>
            <div id="error-msg" class="error hidden"></div>

            <table class="data-table" id="users-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Display Name</th>
                        <th>Admin</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-body">
                </tbody>
            </table>
        </div>

        <div class="card wide">
            <h2>OAuth Clients</h2>

            <table class="data-table" id="clients-table">
                <thead>
                    <tr>
                        <th>Client ID</th>
                        <th>Name</th>
                        <th>Redirect URIs</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="clients-body">
                </tbody>
            </table>

            <h3>Register New Client</h3>
            <form id="client-form">
                <div class="form-group">
                    <label for="client-name">Client Name</label>
                    <input type="text" id="client-name" required>
                </div>
                <div class="form-group">
                    <label for="client-uris">Redirect URIs (JSON array)</label>
                    <input type="text" id="client-uris" required placeholder='["http://localhost:8448/callback"]'>
                </div>
                <button type="submit" class="btn btn-primary">Register Client</button>
            </form>
            <div id="client-result" class="hidden">
                <h4>Client Created</h4>
                <pre id="client-result-json"></pre>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
