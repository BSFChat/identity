<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - BSFChat ID</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main">
        <div class="nav-brand">BSFChat ID</div>
        <div class="nav-links">
            <a href="/profile.html">Account</a>
            <a href="/admin.html" class="active" aria-current="page">Admin</a>
            <button type="button" class="nav-button" id="logout-btn">Sign out</button>
        </div>
    </nav>

    <main class="container">
        <section class="card wide" id="users-section" aria-labelledby="users-heading">
            <h1 class="page-title" id="users-heading">Users</h1>
            <div id="error-msg" class="error hidden" role="alert" aria-live="assertive" tabindex="-1"></div>

            <div class="table-scroll">
            <table class="data-table" id="users-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Display Name</th>
                        <th>Admin</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-body">
                </tbody>
            </table>
            </div>
        </section>

        <section class="card wide" id="clients-section" aria-labelledby="clients-heading">
            <h2 class="page-title" id="clients-heading">OAuth clients</h2>

            <div class="table-scroll">
            <table class="data-table" id="clients-table">
                <thead>
                    <tr>
                        <th>Client ID</th>
                        <th>Name</th>
                        <th>Redirect URIs</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="clients-body">
                </tbody>
            </table>
            </div>

            <h3>Register a new client</h3>
            <form id="client-form">
                <div class="form-group">
                    <label for="client-name">Client name</label>
                    <input type="text" id="client-name" required>
                </div>
                <div class="form-group">
                    <label for="client-uris">Redirect URIs (JSON array)</label>
                    <input type="text" id="client-uris" required placeholder='["http://localhost:8448/callback"]'>
                </div>
                <button type="submit" class="btn btn-primary">Register client</button>
            </form>
            <div id="client-result" class="hidden">
                <h4>Client created. Copy the secret now; it is not shown again.</h4>
                <pre id="client-result-json"></pre>
            </div>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
