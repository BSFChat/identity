<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BSFChat ID</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>BSFChat ID</h1>
                <p class="subtitle">Sign in to your account</p>
            </div>

            <div id="error-msg" class="error hidden"></div>
            <div id="success-msg" class="success hidden"></div>

            <!-- Step 1: Username + Password -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" autofocus
                           autocapitalize="none" autocorrect="off" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
                <p class="form-aside"><a href="/forgot-password.html" id="forgot-link">Forgot password?</a></p>
            </form>

            <!-- Step 2: 2FA Code (hidden until needed) -->
            <div id="2fa-step" class="hidden">
                <p id="totp-hint" style="color: var(--text-secondary); margin-bottom: 16px;">
                    Enter the 6-digit code from your authenticator app.
                </p>
                <form id="2fa-form">
                    <div class="form-group">
                        <label for="totp-code" id="totp-label">Authentication Code</label>
                        <!-- Numeric keypad for authenticator codes; the backup-code
                             toggle below switches it to text, since backup codes are
                             mixed-case letters and digits and compared exactly. -->
                        <input type="text" id="totp-code" maxlength="8" autocomplete="one-time-code"
                               inputmode="numeric" autocapitalize="none" autocorrect="off" spellcheck="false"
                               placeholder="000000"
                               style="text-align:center; font-size:20px; letter-spacing:4px;
                                      font-family:'SF Mono',Monaco,monospace;">
                    </div>
                    <button type="submit" class="btn btn-primary">Verify</button>
                    <p class="form-aside"><a href="#" id="backup-code-toggle">Use a backup code instead</a></p>
                </form>
                <div style="text-align:center; margin-top:12px;">
                    <a href="#" id="back-to-login" style="color:var(--text-muted); font-size:13px;">
                        Back to login
                    </a>
                </div>
            </div>

            <div class="card-footer">
                <p data-requires-registration>Don't have an account? <a href="/register.html" id="register-link">Create one</a></p>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
