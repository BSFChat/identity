<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - BSFChat ID</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="logo">
                <h1>BSFChat ID</h1>
                <p class="subtitle" id="login-subtitle">Sign in to your account</p>
            </div>

            <!-- Filled in when an app sent the browser here (/authorize). -->
            <p id="requesting-app" class="requesting-app hidden"></p>

            <div id="error-msg" class="error hidden" role="alert" aria-live="assertive" tabindex="-1"></div>
            <div id="success-msg" class="success hidden" role="status" aria-live="polite"></div>

            <!-- Step 1: Username + Password -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" autofocus
                           autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Sign in</button>
                <p class="form-aside"><a href="/forgot-password.html" id="forgot-link">Forgot password?</a></p>
            </form>

            <!-- Step 2: 2FA Code (hidden until needed) -->
            <div id="2fa-step" class="hidden">
                <p id="totp-hint" class="lead">
                    Enter the 6-digit code from your authenticator app.
                </p>
                <form id="2fa-form">
                    <div class="form-group">
                        <label for="totp-code" id="totp-label">Authentication code</label>
                        <!-- Numeric keypad for authenticator codes; the backup-code
                             toggle below switches it to text. -->
                        <input type="text" id="totp-code" maxlength="12" autocomplete="one-time-code"
                               inputmode="numeric" autocapitalize="none" autocorrect="off" spellcheck="false"
                               placeholder="000000" class="code-field">
                    </div>
                    <button type="submit" class="btn btn-primary">Verify</button>
                    <p class="form-aside">
                        <button type="button" class="link-button" id="backup-code-toggle">Use a backup code instead</button>
                    </p>
                </form>
                <p class="form-aside">
                    <button type="button" class="link-button muted-link" id="back-to-login">Back to sign in</button>
                </p>
            </div>

            <div class="card-footer">
                <p data-requires-registration>Don't have an account? <a href="/register.html" id="register-link">Create one</a></p>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
